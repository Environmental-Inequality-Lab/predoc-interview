<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="4;url=https://scheduler.zoom.us/d/wn0wz97y/uva-pre-doctoral-associate-interview-scheduling">
  <meta name="robots" content="noindex">
  <title>Pre-Doc Interview Scheduling · Environmental Inequality Lab</title>
  <link rel="canonical" href="https://scheduler.zoom.us/d/wn0wz97y/uva-pre-doctoral-associate-interview-scheduling">
  <link rel="icon" type="image/png" href="eil-logo.png">
  <style>
    :root {
      --maroon: #5A1A19;
      --maroon-soft: #7a2e2c;
      --ink: #2b2523;
      --muted: #6f6663;
      --line: #e9e2df;
      --bg: #f7f4f2;
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background:
        radial-gradient(1200px 600px at 50% -10%, #ffffff 0%, rgba(255,255,255,0) 70%),
        var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border: 1px solid var(--line);
      border-top: 4px solid var(--maroon);
      border-radius: 14px;
      box-shadow: 0 1px 2px rgba(43, 37, 35, 0.04), 0 12px 32px rgba(43, 37, 35, 0.08);
      padding: 40px 36px 32px;
      text-align: center;
    }

    .logo {
      display: block;
      width: 220px;
      max-width: 70%;
      height: auto;
      margin: 0 auto 28px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.35rem;
      font-weight: 650;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.55;
    }

    .progress {
      height: 4px;
      margin: 28px auto 24px;
      max-width: 240px;
      background: var(--line);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--maroon);
      border-radius: inherit;
      animation: fill 3s linear forwards;
    }

    @keyframes fill { to { width: 100%; } }

    .button {
      display: inline-block;
      padding: 11px 22px;
      background: var(--maroon);
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      border-radius: 8px;
      transition: background 0.15s ease;
    }

    .button:hover, .button:focus-visible { background: var(--maroon-soft); }

    .button:focus-visible { outline: 3px solid rgba(90, 26, 25, 0.25); outline-offset: 2px; }

    .footer {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      font-size: 0.82rem;
    }

    .footer a { color: var(--maroon); text-decoration: none; }
    .footer a:hover { text-decoration: underline; }

    @media (max-width: 420px) {
      .card { padding: 32px 22px 26px; }
      h1 { font-size: 1.2rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .progress span { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="eil-logo.png" alt="Environmental Inequality Lab">
    <h1>Pre-Doctoral Associate Interview Scheduling</h1>
    <p>Taking you to the Zoom scheduler to choose an interview time.</p>
    <div class="progress" aria-hidden="true"><span></span></div>
    <a class="button" href="https://scheduler.zoom.us/d/wn0wz97y/uva-pre-doctoral-associate-interview-scheduling">Continue to scheduling</a>
    <p class="footer">
      <a href="https://www.environmental-inequality-lab.org/">Environmental Inequality Lab</a> · University of Virginia
    </p>
  </main>

  <script>
    setTimeout(function () {
      window.location.replace("https://scheduler.zoom.us/d/wn0wz97y/uva-pre-doctoral-associate-interview-scheduling");
    }, 3000);
  </script>
</body>
</html>
